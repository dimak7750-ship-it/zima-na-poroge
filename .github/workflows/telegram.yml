name: Отчёт в Telegram

on:
  push:
    branches: [main]
    paths: ['reports/*.md', 'outbox/*.txt']
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Отправить отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'reports/*.md' 'outbox/*.txt')
          fi
          python3 scripts/send_telegram.py $FILES
